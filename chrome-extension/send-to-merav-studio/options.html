<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Send to MERAV Studio Settings</title>
    <style>
      body {
        margin: 0;
        background: #f7f5ef;
        color: #17130f;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(720px, calc(100vw - 48px));
        margin: 48px auto;
        background: white;
        border: 1px solid #ded9cd;
        padding: 32px;
      }
      h1 {
        margin: 0 0 8px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 38px;
        font-weight: 400;
      }
      p {
        color: #675f55;
        line-height: 1.5;
      }
      label {
        display: block;
        margin-top: 20px;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #675f55;
      }
      input {
        margin-top: 8px;
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #ded9cd;
        padding: 12px;
        font-size: 14px;
      }
      button {
        margin-top: 24px;
        border: 1px solid #17130f;
        background: #17130f;
        color: white;
        padding: 12px 18px;
        cursor: pointer;
      }
      .status {
        margin-top: 16px;
        min-height: 20px;
        color: #1f4e5f;
      }
      code {
        background: #f1eee7;
        padding: 2px 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Send to MERAV Studio</h1>
      <p>
        Open a MERAV design board once and this extension will remember that project. You can also
        paste a project ID below. After setup, right-click any product image and choose
        <code>Send to MERAV Studio</code>.
      </p>
      <label>
        Studio URL
        <input id="studioUrl" placeholder="https://studio.meravinteriors.com" />
      </label>
      <label>
        Project ID
        <input id="projectId" placeholder="Project UUID" />
      </label>
      <label>
        Extension Token
        <input id="extensionToken" type="password" placeholder="MERAV extension token" />
      </label>
      <button id="save">Save Settings</button>
      <div id="status" class="status"></div>
    </main>
    <script src="options.js"></script>
  </body>
</html>
