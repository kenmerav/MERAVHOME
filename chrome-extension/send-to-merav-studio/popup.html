<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Send to MERAV Studio</title>
    <style>
      body {
        width: 360px;
        margin: 0;
        background: #f7f5ef;
        color: #17130f;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        padding: 18px;
      }
      h1 {
        margin: 0 0 6px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 26px;
        font-weight: 400;
      }
      p {
        margin: 0 0 14px;
        color: #675f55;
        font-size: 13px;
        line-height: 1.4;
      }
      label {
        display: block;
        margin-top: 12px;
        color: #675f55;
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      select {
        width: 100%;
        margin-top: 7px;
        box-sizing: border-box;
        border: 1px solid #ded9cd;
        background: white;
        padding: 10px;
        color: #17130f;
        font-size: 13px;
      }
      button {
        width: 100%;
        margin-top: 14px;
        border: 1px solid #17130f;
        background: #17130f;
        color: white;
        padding: 11px 14px;
        cursor: pointer;
      }
      button.secondary {
        background: white;
        color: #17130f;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .status {
        min-height: 18px;
        margin-top: 12px;
        color: #1f4e5f;
        font-size: 12px;
        line-height: 1.35;
      }
      .error {
        color: #9d2c21;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Send to Studio</h1>
      <p>Choose the project, then send the current product page into the active design board.</p>
      <label>
        Project
        <select id="projectSelect">
          <option value="">Loading projects...</option>
        </select>
      </label>
      <div class="row">
        <button id="send">Send Current Product</button>
        <button id="options" class="secondary">Settings</button>
      </div>
      <div id="status" class="status"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
