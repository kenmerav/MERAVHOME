<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mock Retailer — Natural Oak Pendant</title>
  </head>
  <body>
    <main data-mock-retailer="safe">
      <h1>Natural Oak Pendant</h1>
      <p data-sku>SKU PEND-24-OAK</p>
      <label>
        Finish
        <select>
          <option>Natural Oak</option>
          <option>Walnut</option>
        </select>
      </label>
      <label>
        Size
        <select>
          <option>24-inch</option>
          <option>30-inch</option>
        </select>
      </label>
      <label>
        Quantity
        <input type="number" value="1" min="1" />
      </label>
      <p data-price>$249.00</p>
      <button type="button">Add to cart</button>
    </main>
  </body>
</html>
