interface:
  display_name: "Merav Cart Workflow"
  short_description: "Build carts and draft rep emails safely"
  default_prompt: "Use $merav-cart-workflow to process a prepared Studio cart run, use Studio's draft-only tool for retailer-rep emails, and use @Chrome for online retailers."
dependencies:
  tools:
    - type: "mcp"
      value: "merav-cart-builder"
      description: "Token-scoped MERAVHOME Studio procurement runs"
      transport: "streamable_http"
      url: "https://studio.meravinteriors.com/api/procurement-mcp"
policy:
  allow_implicit_invocation: true
