name: Verify Studio Hosting Access
on:
  push:
    branches: [codex/pricing-live-check-20261008]
    paths: [.github/workflows/codex-pricing-live-check.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read current Studio deployment through existing Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
        run: |
          python3 -u - <<'PY'
          import json, os, urllib.request, urllib.parse, urllib.error
          token = os.environ.get('VERCEL_TOKEN', '').strip()
          if not token:
              raise SystemExit('VERCEL_ACCESS_NOT_CONFIGURED: No Vercel deployment credential is available to this repository workflow. Production code is pushed, but direct hosting deployment cannot be triggered here.')
          query = {'withGitRepoInfo': 'true'}
          team = os.environ.get('VERCEL_ORG_ID', '').strip()
          if team:
              query['teamId'] = team
          url = 'https://api.vercel.com/v13/deployments/studio.meravinteriors.com?' + urllib.parse.urlencode(query)
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/json'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  deployment = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit('VERCEL_DEPLOYMENT_READ_FAILED: HTTP ' + str(error.code))
          source = deployment.get('gitSource') or {}
          meta = deployment.get('meta') or {}
          print(json.dumps({
              'deployment_id': deployment.get('id') or deployment.get('uid'),
              'project_id': deployment.get('projectId'),
              'project_name': deployment.get('name'),
              'state': deployment.get('readyState'),
              'target': deployment.get('target'),
              'git_type': source.get('type'),
              'git_repo_id': source.get('repoId'),
              'git_sha': source.get('sha') or meta.get('githubCommitSha'),
              'git_repo': meta.get('githubCommitRepo'),
              'git_owner': meta.get('githubCommitOrg'),
          }))
          PY
